name = "cyd-2432s032c"
chip = "esp32"
description = "Sunton ESP32-2432S032C: 3.2-inch ST7789 240x320 IPS, GT911 capacitive touch"
sources = ["https://github.com/rzeldent/platformio-espressif32-sunton/blob/main/esp32-2432S032C.json"]

[display]
controller = "st7789"
width = 240
height = 320
mirror_x = false
bgr = false
ips = true
sclk = 14
mosi = 13
miso = 12
cs = 15
dc = 2
backlight = 27

[touch]
controller = "gt911"
sda = 33
scl = 32
address = 0x5d
int = 21
rst = 25

[led]
pins = [4, 16, 17]            # red, green, blue: common anode
active = "low"

[board]
boot = 0
ldr = 34
sd = [18, 23, 19, 5]
speaker = 26
