name = "cyd-2432s024c"
chip = "esp32"
description = "Sunton ESP32-2432S024C: 2.4-inch ILI9341 240x320, CST816S capacitive touch"
sources = ["https://github.com/rzeldent/platformio-espressif32-sunton/blob/main/esp32-2432S024C.json"]

[display]
controller = "ili9341"
width = 240
height = 320
mirror_x = true
bgr = true
ips = false
sclk = 14
mosi = 13
miso = 12
cs = 15
dc = 2
backlight = 27

[touch]
controller = "cst816s"
sda = 33
scl = 32
address = 0x15
int = 21
rst = 25

[led]
pins = [4, 16, 17]            # red, green, blue: common anode
active = "low"

[board]
boot = 0
ldr = 34
sd = [18, 23, 19, 5]
speaker = 26
