name = "cyd-3248s035c"
chip = "esp32"
description = "Sunton ESP32-3248S035C: 3.5-inch ST7796 320x480, GT911 capacitive touch"
sources = ["https://github.com/rzeldent/platformio-espressif32-sunton/blob/main/esp32-3248S035C.json"]

[display]
controller = "st7796"
width = 320
height = 480
mirror_x = true
bgr = true
ips = false
sclk = 14
mosi = 13
miso = 12
cs = 15
dc = 2
backlight = 27

[touch]
controller = "gt911"
sda = 33
scl = 32
address = 0x5d
int = 21
rst = 25

[led]
pins = [4, 16, 17]            # red, green, blue: common anode
active = "low"

[board]
boot = 0
ldr = 34
sd = [18, 23, 19, 5]
speaker = 26
