name: release
# Builds the Windows release zip, cyd-lab-windows-x64.zip: cyd-lab.exe, esp32sim.exe (this
# repository's engine), the Arduino tools and example, README-QUICKSTART.txt and LICENSES/.
# Cross-built on Linux for x86_64-pc-windows-gnu with a static CRT, the same recipe as the
# hand-built zips, then smoke-run on a real Windows runner.
#
# Actions > release > Run workflow: the zip as a build artifact.
# Push a tag like v1.0.0: the zip is also attached to that tag's GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  TARGET: x86_64-pc-windows-gnu
  ZIP: cyd-lab-windows-x64.zip
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          workspaces: |
            .
            cyd-lab
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build the engine (esp32sim.exe, static CRT)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p esp32sim --bin esp32sim --target "$TARGET"
      - name: Build cyd-lab (cyd-lab.exe, discovery, monitor; static CRT via cyd-lab/.cargo/config.toml)
        working-directory: cyd-lab
        run: cargo build --release --locked --bins --target "$TARGET"
      - name: Check DLL imports (Windows system DLLs only)
        run: |
          bad=0
          for exe in "target/$TARGET/release/esp32sim.exe" "cyd-lab/target/$TARGET/release/"cyd-lab*.exe; do
            dlls=$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '[:upper:]' '[:lower:]' | sort -u | tr '\n' ' ')
            echo "$exe -> $dlls"
            for d in $dlls; do
              case $d in libgcc*|libwinpthread*|libstdc*|vcruntime*|msvcp*) echo "::error::$exe imports $d"; bad=1 ;; esac
            done
          done
          exit $bad
      - name: Package the zip
        run: |
          python3 cyd-lab/tools/package_windows.py --target "$TARGET" \
            --bin-dir "cyd-lab/target/$TARGET/release" \
            --engine "target/$TARGET/release/esp32sim.exe" --engine-src . \
            --strip x86_64-w64-mingw32-strip --out "release/$ZIP"
      - name: Check the zip's contents
        run: |
          unzip -Z1 "release/$ZIP" > contents.txt
          for f in cyd-lab/cyd-lab.exe cyd-lab/esp32sim.exe cyd-lab/README-QUICKSTART.txt \
                   cyd-lab/arduino/tools/cyd-lab-discovery.exe cyd-lab/arduino/tools/cyd-lab-monitor.exe \
                   cyd-lab/LICENSES/esp32sim-LICENSE.txt; do
            grep -qx "$f" contents.txt || { echo "::error::$f missing from the zip"; exit 1; }
          done
          grep -q '^cyd-lab/arduino/examples/' contents.txt || { echo "::error::no Arduino examples in the zip"; exit 1; }
          sha256sum "release/$ZIP" | tee "release/$ZIP.sha256"
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-lab-windows-x64
          path: |
            release/${{ env.ZIP }}
            release/${{ env.ZIP }}.sha256
          if-no-files-found: error

  smoke:
    # The exes start on real Windows (the build above never runs them).
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cyd-lab-windows-x64
      - name: Run esp32sim.exe and the Arduino discovery tool
        run: |
          unzip -q "$ZIP"
          ./cyd-lab/esp32sim.exe --help > /dev/null
          ./cyd-lab/esp32sim.exe --list-boards | grep -q cyd-2432s028r
          printf 'HELLO 1 "ci"\nQUIT\n' | ./cyd-lab/arduino/tools/cyd-lab-discovery.exe | grep -q '"hello"'

  publish:
    # Tag pushes only: attach the zip to the tag's GitHub Release (created if it doesn't exist).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cyd-lab-windows-x64
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            pre=; case $TAG in *-*) pre=--prerelease ;; esac
            notes="Windows x64 build of cyd-lab with the esp32sim engine: unzip cyd-lab-windows-x64.zip and run cyd-lab.exe (SHA-256 in the .sha256 file). CYD_EMU releases start at v1.0.0; esp32sim's upstream v0.x tags are not part of this repository."
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" $pre --verify-tag --generate-notes --notes "$notes" \
              --title "cyd-lab $TAG" --repo "$GITHUB_REPOSITORY"
          fi
