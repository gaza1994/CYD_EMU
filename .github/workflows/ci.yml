name: ci
# CYD_EMU's checks on every push and pull request: the esp32sim engine's tests at the
# repository root, and cyd-lab's (its own Cargo workspace in cyd-lab/). Upstream esp32sim's
# much larger CI (evidence checks, clippy, wasm, Node tests) is esp32sim-ci.yml, run by hand.
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned by release and SHA-256 in the script, which is also the cache key.
      - uses: actions/cache@v4
        with:
          path: roms
          key: rom-elfs-${{ hashFiles('tools/fetch-rom-elfs.sh') }}
      - name: Fetch the mask ROM ELFs (Apache-2.0, espressif/esp-rom-elfs; not committed)
        run: tools/fetch-rom-elfs.sh roms
      - name: Test the engine
        run: ESP32SIM_ROM_DIR=$PWD/roms cargo test --release --locked --workspace
  cyd-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyd-lab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cyd-lab
      - name: Test cyd-lab
        run: cargo test --locked
  windows-cross:
    # The release zip's build: catches Windows-only compile errors on every push.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyd-lab
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cyd-lab
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Check cyd-lab for Windows
        run: cargo check --locked --bins --target x86_64-pc-windows-gnu
