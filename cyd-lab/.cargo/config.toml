# Release builds for Windows are fully static: the zip must run on a bare
# Windows machine without the MinGW runtime DLLs (libgcc_s, libwinpthread).
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
