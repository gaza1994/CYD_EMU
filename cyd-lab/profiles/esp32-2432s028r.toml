# ESP32-2432S028R — the original "Cheap Yellow Display" (CYD).
# 2.8" ILI9341 240x320 TFT, XPT2046 resistive touch, ESP32-WROOM-32 (4 MB flash, no PSRAM).
#
# Only [chip], [engine] and [flash] drive the emulator today. Everything else is
# metadata that documents the board (and will drive engine options later).

id = "esp32-2432s028r"
name = "ESP32-2432S028R original (micro-USB)"
description = "Cheap Yellow Display: ESP32-WROOM-32, 2.8in ILI9341 240x320 + XPT2046 resistive touch, RGB LED, LDR, micro-SD, CH340 USB-serial."
vendor = "Sunton"
chip = "esp32"
psram_mb = 0

[engine]
board = "cyd-2432s028r"          # esp32sim --board name (model being written in parallel)
rom = "esp32_rev300_rom.elf"     # looked up in the ROM directory (ESP32SIM_ROM_DIR)
console = "uart0"                # esp32sim --console source that carries the classic ESP32's serial
extra_args = []

[flash]
size_mb = 4
mode = "dio"
freq_mhz = 40

[display]
controller = "ILI9341"
width = 240
height = 320
default_rotation = 0             # cyd-lab view rotation (degrees) for new devices
bus = "HSPI"
[display.pins]
sck = 14
mosi = 13
miso = 12
cs = 15
dc = 2
backlight = 21

[touch]
controller = "XPT2046"
bus = "VSPI (bit-banged in most sketches)"
[touch.pins]
clk = 25
mosi = 32
miso = 39
cs = 33
irq = 36

[rgb_led]
active_low = true
red = 4
green = 16
blue = 17

[ldr]
pin = 34

[usb_serial]
chip = "CH340"
vid = 0x1A86
pid = 0x7523
auto_reset = true                # DTR/RTS -> IO0/EN transistor pair, as on most ESP32 dev boards

[[buttons]]
name = "BOOT"
pin = 0
[[buttons]]
name = "EN / RST"
pin = -1                         # not a GPIO: chip enable
