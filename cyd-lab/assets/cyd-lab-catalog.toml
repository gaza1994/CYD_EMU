[[overrides]]
id = "esphome-web"
name = "ESPHome (official, for Home Assistant)"
group = "home-assistant"
pinned = true
profiles = ["cyd-2432s028r", "cyd-2432s028r-2usb", "cyd-2432s024", "cyd-2432s032", "cyd-3248s035"]
description = "The official ESPHome firmware: the stock ESP32 image that ESPHome's web installer (web.esphome.io, ESP Web Tools) puts on a new board, byte for byte. It offers Wi-Fi setup over USB (Improv serial) and Bluetooth, plus a fallback hotspot, so Home Assistant finds it and you can adopt it. The screen stays dark until you adopt it in Home Assistant and install your own YAML, exactly as on a real board."
emulator_notes = "Checked in the emulator: Improv over serial and Bluetooth (BLE Improv service) and the fallback hotspot esphome-web-xxxxxx start, Send Wi-Fi details joins it, and Home Assistant reaches the API on 6053 through the published port. The screen stays dark (nothing drives the backlight on GPIO21), as on a real board."
notes = "Generic ESP32 build with no display driver: that comes with your own YAML after adoption (the \"ESPHome CYD starter YAML\" entry has one for this board)."
home_assistant = true
first_setup = { improv = true, hotspot = "esphome-web-xxxxxx", password = "", page = "http://192.168.4.1", note = "the screen stays dark: use Send Wi-Fi details (Improv over USB) or join its hotspot" }
steps = ["The screen stays dark until you install your own YAML. That is normal: a real board does the same.", "After adding it to Home Assistant: in the ESPHome Builder add-on, Adopt it, put your display config in its YAML (the ESPHome CYD starter YAML in Install firmware… has one) and Install."]

[[overrides]]
id = "circuitpython"
group = "other"
first_setup = { note = "Wi-Fi goes in settings.toml on its USB drive" }
