# ESPHome starter config for the ESP32-2432S028R "Cheap Yellow Display" (classic ESP32, 4MB, no PSRAM)
# Pins: ILI9341 on HSPI (CLK14 MOSI13 MISO12 CS15 DC2, BL21), XPT2046 on its own bus
# (CLK25 MOSI32 MISO39 CS33 IRQ36), RGB LED 4/16/17 (active low), LDR on GPIO34.
# Build with `esphome compile esphome-cyd-2432s028r.yaml`; the factory image is
# .esphome/build/cyd-panel/.pioenvs/cyd-panel/firmware.factory.bin (flash @0x0).
substitutions:
  name: cyd-panel
  friendly_name: Cheap Yellow Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ap:
    ssid: "${name}-setup"
captive_portal:

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin:
      number: GPIO39
      ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    id: led_r
    pin: { number: GPIO4, inverted: true }
  - platform: ledc
    id: led_g
    pin: { number: GPIO16, inverted: true }
  - platform: ledc
    id: led_b
    pin: { number: GPIO17, inverted: true }

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: RGB LED
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

sensor:
  - platform: adc
    pin: GPIO34
    name: Light level (LDR)
    attenuation: 12db
    update_interval: 10s

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 24

display:
  - platform: ili9xxx
    id: tft
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    color_palette: 8BIT          # no PSRAM: a full 16-bit buffer will not fit
    dimensions: { width: 240, height: 320 }
    rotation: 90
    lambda: |-
      it.fill(Color::BLACK);
      it.print(it.get_width() / 2, it.get_height() / 2, id(roboto), Color(255, 255, 0),
               TextAlign::CENTER, "Hello CYD");

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
