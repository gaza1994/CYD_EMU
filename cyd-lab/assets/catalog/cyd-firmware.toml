[[entries]]
id = "marauder"
name = "ESP32 Marauder"
description = "Wi-Fi / Bluetooth offensive toolkit with on-device menu UI."
homepage = "https://github.com/justcallmekoko/ESP32Marauder"
licence = "MIT"
profiles = ["cyd-2432s028r", "cyd-2432s028r-2usb", "cyd-2432s024", "cyd-3248s035"]
version = "1.19.2"
emulator_status = "partial"
emulator_notes = "Shows the 'ESP32 Marauder v1.19.2 Initializing...' splash and stays there: its older Bluetooth controller (IDF 4.4) needs radio events the emulator does not model yet."
notes = """
App-only release assets need bootloader@0x1000 + partition-table@0x8000 +
ota-data@0xe000 from marauder-installer-assets.zip (same release). Official
flasher https://justcallmekoko.github.io/MarauderInstaller/ is custom (not
ESP Web Tools). Classic CYD build is IDF 4.4.5; 2usb build is IDF 5.5.1.
Installer-zip 2usb app sha differs from the standalone release asset.
"""
[entries.source]
type = "github-release"
repo = "justcallmekoko/ESP32Marauder"
tag = "v1.19.2"
asset_app = "esp32_marauder_v1_19_2_20261023_cyd_2432S028.bin"
asset_bundle = "marauder-installer-assets.zip"
parts = [
  { path_pattern = "esp32_marauder_*_cyd_2432S028.bootloader.bin", offset = 4096, sha256 = "0fdc7cfec9ebdeabc63484b2569488f60b2100f34b01db323b03372132b0f5f1", size = 17568 },
