[[entries]]
id = "wled"
name = "WLED"
description = "LED controller firmware (no on-device TFT UI — web / LED output only)."
homepage = "https://kno.wled.ge/"
licence = "EUPL-1.2"
profiles = ["cyd-2432s028r"]
version = "16.0.1"
emulator_status = "works"
emulator_notes = "Boots (Adafruit bootloader banner, Wi-Fi, RMT activity); 0 RAMWR — no TFT driver, expected."
notes = """
install.wled.me builds a virtual manifest in app.js — no static URL.
Bootloader from install.wled.me is 8 MB-flagged; cyd-lab must reflag the
header size nibble to 4 MB and recompute the appended SHA-256 (same as the
WLED installer does client-side). Partitions: partitions_c3_4m.bin @0x8000.
"""
[entries.source]
type = "github-release"
repo = "wled/WLED"
tag = "v16.0.1"
parts = [
  { url = "https://install.wled.me/bin/boot/bootloaders/esp32/bootloader_esp32_8m.bin", offset = 4096, sha256 = "dd83e828882288c738d5f8916ba74d400491e6832abd65440b91f0a03fd2308e", size = 16384, patch_flash_size_mb = 4 },
  { url = "https://install.wled.me/bin/boot/partitions/partitions_c3_4m.bin", offset = 32768, sha256 = "ab7a19ebb0ea19e684687802f2d8f199225a270c6b7dd72d73e8a8876f382e73", size = 3072 },
