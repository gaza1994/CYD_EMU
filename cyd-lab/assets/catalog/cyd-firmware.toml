# CYD firmware catalogue for cyd-lab (Windows emulator / flasher).
# schema_version bumps when the entry shape changes incompatibly.
# Bundled with the app; optional refresh from a raw GitHub URL (see README).
schema_version = 1
updated = "2026-10-24"
notes = """
Verified against esp32sim --chip esp32 --board cyd (ESP32-2432S028R /
ILI9341 / XPT2046, 4 MB, no PSRAM). Profiles list which board variants an
entry targets; the emulator currently models only the classic ILI9341 board.
"""

[[profiles]]
id = "cyd-2432s028r"
name = "ESP32-2432S028R (classic)"
chip = "esp32"
flash_mb = 4
psram = false
display = "ILI9341"
display_notes = "HSPI CLK14 MOSI13 MISO12 CS15 DC2 BL21; XPT2046 CLK25 MOSI32 MISO39 CS33 IRQ36; RGB 4/16/17; LDR 34; CH340 USB-UART"
aliases = ["cyd", "2432S028R", "Cheap Yellow Display"]

[[profiles]]
id = "cyd-2432s028r-2usb"
name = "ESP32-2432S028R 2-USB / USB-C"
chip = "esp32"
flash_mb = 4
psram = false
display = "ST7789"
display_notes = "Same pins as classic; panel is ST7789 (BGR, inversion off). Emulator models ILI9341 only — UI colours / inversion will look wrong."
aliases = ["cyd2usb", "2-USB", "USB-C"]

[[profiles]]
id = "cyd-2432s024"
name = "ESP32-2432S024"
chip = "esp32"
flash_mb = 4
psram = false
display = "ILI9341"
aliases = ["2432S024"]

[[profiles]]
