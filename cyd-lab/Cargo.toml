[package]
name = "cyd-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gareth Johnstone"]
description = "Desktop manager for emulated ESP32 'Cheap Yellow Display' boards (esp32sim front end)"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rfd = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
url = "2"
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
